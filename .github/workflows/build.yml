name: Build Boards

on:
  workflow_dispatch:

jobs:
  build:
    name: Build bread-compact-wifi-128x64
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build current variant
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py bread-compact-wifi --name bread-compact-wifi-128x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi_bread-compact-wifi-128x64
          path: build/merged-binary.bin
          if-no-files-found: error

